<!DOCTYPE html>
<html lang="fr">
<head>

<style>
  :root { --vert:#1f7a4d; --gris:#f2f3f5; --bord:#d6d9de; --texte:#1d2228; --rouge:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Roboto,sans-serif; color:var(--texte); background:#fff; font-size:17px; -webkit-text-size-adjust:100%; }
  button { font-family:inherit; color:var(--texte); touch-action:manipulation; }
  header { background:var(--vert); color:#fff; padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top, 0px)); position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:18px; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header button { background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:8px; padding:8px 12px; font-size:15px; }
  main { padding:14px 14px calc(120px + env(safe-area-inset-bottom, 0px)); max-width:720px; margin:0 auto; }
  .btn { display:block; width:100%; border:0; border-radius:10px; padding:14px; font-size:17px; font-weight:600; margin:8px 0; background:var(--vert); color:#fff; }
  .btn .sous { display:block; font-weight:400; font-size:13px; opacity:.92; margin-top:2px; }
  .btn.sec { background:var(--gris); color:var(--texte); border:1px solid var(--bord); }
  details.repli { border:1px solid var(--bord); border-radius:12px; margin:12px 0; background:#fff; }
  details.repli summary { padding:12px 14px; font-weight:600; cursor:pointer; }
  details.repli[open] summary { border-bottom:1px solid var(--bord); }
  details.repli > div { margin-left:10px; margin-right:10px; }
  details.repli > .dedans { padding-bottom:10px; }
  .compte { font-weight:400; color:#5b636e; font-size:14px; margin-left:8px; white-space:nowrap; }
  ol.etapes { margin:8px 0; padding-left:22px; }
  ol.etapes li { margin:7px 0; }
  .btn.danger { background:#fff; color:var(--rouge); border:1px solid var(--rouge); font-weight:500; }
  .carte { border:1px solid var(--bord); border-radius:12px; padding:12px 14px; margin:10px 0; background:#fff; cursor:pointer; }
  .carte .t { font-weight:600; font-size:18px; }
  .carte .s { color:#5b636e; font-size:14px; margin-top:3px; }
  .carte.mini { padding:9px 12px; margin:6px 0; border-left:5px solid var(--bord); }
  .carte.mini .t { font-size:16px; }
  .carte.mini.fait { border-left-color:var(--vert); background:#f4faf6; }
  .carte.q .t { font-size:16px; margin-bottom:4px; }
  .carte.q input[type=text], .carte.q textarea { margin-top:6px; }
  .carte.q textarea { min-height:110px; }
  .etiq { display:inline-block; background:var(--vert); color:#fff; font-size:12px; font-weight:600; border-radius:6px; padding:2px 7px; vertical-align:middle; margin-left:6px; }
  .etiq.ap { background:#6b7480; }
  .grand { font-weight:600; font-size:19px; margin:6px 0 2px; }
  .note { color:#5b636e; font-size:14px; margin:6px 0; }
  input[type=text], input[type=date], textarea { width:100%; font-size:17px; padding:12px; border:1px solid var(--bord); border-radius:10px; font-family:inherit; color:var(--texte); background:#fff; -webkit-appearance:none; appearance:none; }
  textarea { min-height:220px; line-height:1.4; }
  label.l { display:block; font-weight:600; margin:14px 0 6px; }
  .grille { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
  .grille button { border:1px solid var(--bord); background:var(--gris); border-radius:20px; padding:9px 14px; font-size:15px; }
  .grille.puces button.sel { background:var(--vert); border-color:var(--vert); color:#fff; font-weight:600; }
  .photos { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
  .photos div { position:relative; }
  .photos img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; border:1px solid var(--bord); }
  .photos button { position:absolute; top:4px; right:4px; background:rgba(0,0,0,.6); color:#fff; border:0; border-radius:6px; font-size:13px; padding:4px 7px; }
  .plans { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:10px; margin-top:8px; }
  .plan { border:1px solid var(--bord); border-radius:10px; padding:6px; background:var(--gris); }
  .plan img { width:100%; aspect-ratio:4/3; object-fit:contain; border-radius:6px; display:block; background:#fff; }
  .plan input[type=text] { margin-top:6px; padding:8px; font-size:16px; }
  .plan .rang { display:flex; gap:6px; margin-top:6px; }
  .plan .rang button { flex:1; border:1px solid var(--bord); background:#fff; border-radius:8px; padding:8px; font-size:14px; }
  .info { background:#eef6f1; border:1px solid #cfe5d8; border-radius:10px; padding:10px 12px; font-size:14px; margin:10px 0; }
  .alerte { background:#fff4e5; border:1px solid #f3d19c; border-radius:10px; padding:10px 12px; font-size:14px; margin:10px 0; }
  .alerte .btn, .info .btn { margin:8px 0 2px; }
  .barre { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--bord); padding:8px 14px calc(14px + env(safe-area-inset-bottom, 0px)); max-height:70vh; overflow:auto; }
  .barre .btn { margin:4px auto; max-width:692px; }
  .ok { color:var(--vert); font-size:14px; min-height:18px; }
  .version { color:#8a929c; font-size:12px; text-align:center; margin-top:24px; }
  .cache { display:none; }
  #visionneuse { position:fixed; inset:0; background:#111; z-index:20; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top, 0px); }
  #visionneuse.cache { display:none; }
  #visionneuse .haut { display:flex; align-items:center; gap:8px; padding:10px 12px; color:#fff; }
  #visionneuse .haut span { flex:1; font-size:14px; }
  #visionneuse .haut button { background:rgba(255,255,255,.2); color:#fff; border:0; border-radius:8px; padding:9px 14px; font-size:15px; }
  #visionneuse .zone { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; }
  #visionneuse .zone img { display:block; width:100%; margin:0 0 12px; background:#fff; }
  #visionneuse .zone.zoom img { width:250%; max-width:none; }
  #visionneuse .nom { color:#ddd; font-size:14px; padding:6px 12px; }
</style>

<body>
<header>
  <button id="retour" class="cache">Retour</button>
  <h1 id="titre">Visites</h1>
</header>
<main id="vue"></main>
<div class="barre cache" id="barre"></div>
<div id="visionneuse" class="cache">
  <div class="haut"><span>Touche le plan pour zoomer, touche encore pour revenir</span><button id="fermerPlan">Fermer</button></div>
  <div class="zone" id="zonePlan"></div>
</div>
<input type="file" id="fichier" accept="image/*" multiple class="cache">
<input type="file" id="fichierPlan" accept="image/*" multiple class="cache">
<input type="file" id="cameraPhoto" accept="image/*" capture="environment" class="cache">
<input type="file" id="cameraPlan" accept="image/*" capture="environment" class="cache">

<script>
const VERSION = "6.3";

/* ---------- Où tourne l'appli ---------- */
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const EN_LIGNE = location.protocol === "http:" || location.protocol === "https:"; // appli installée depuis une adresse internet
// iPhone : page ouverte ailleurs que dans Safari (Chrome, Google, Facebook, Messenger, Instagram…) ; l'icône ne s'installe bien que depuis Safari
const HORS_SAFARI = IOS && /CriOS|FxiOS|EdgiOS|OPiOS|OPT\/|GSA\/|FBAN|FBAV|FB_IAB|Instagram|Line\/|MicroMessenger|Snapchat|LinkedInApp|DuckDuckGo/.test(navigator.userAgent);
const estInstallee = () => { try { return navigator.standalone === true || matchMedia("(display-mode: standalone)").matches; } catch (e) { return false; } };

/* ---------- Stockage dans le téléphone (IndexedDB) ---------- */
let db;
function ouvrirBase() {
  return new Promise((ok, ko) => {
    const r = indexedDB.open("visites_diagproeco", 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore("visites", { keyPath: "id" });
      d.createObjectStore("photos", { keyPath: "id" });
    };
    r.onsuccess = () => { db = r.result; ok(); };
    r.onerror = () => ko(r.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((ok, ko) => {
    const t = db.transaction(store, mode);
    const s = t.objectStore(store);
    const res = fn(s);
    t.oncomplete = () => ok(res && res.result !== undefined ? res.result : undefined);
    t.onerror = () => ko(t.error);
  });
}
const lireTout = (store) => new Promise((ok, ko) => {
  const r = db.transaction(store).objectStore(store).getAll();
  r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
});
const lire = (store, id) => new Promise((ok, ko) => {
  const r = db.transaction(store).objectStore(store).get(id);
  r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
});
const ecrire = (store, obj) => tx(store, "readwrite", s => s.put(obj));
const effacer = (store, id) => tx(store, "readwrite", s => s.delete(id));
const nouvelId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- Amiante / plomb : noms de pièces habituels ---------- */
const PIECES = ["Entrée","Séjour","Cuisine","Séjour/cuisine","Salon","Chambre","SDB","WC","SDB/WC","Douche","DGT","Palier","Bureau","Cellier","Buanderie","Pièce",
  "Comble","Garage","Cave","Local","Dépendance","Abri","Atelier",
  "Façade","Forgets","Conduits de fumée et raccordements","Regards","Parties extérieures"];

/* ---------- Audit énergétique : types de maison, 10 points, pathologies, questions ---------- */
const TYPES = [
  { c: "pierre", n: "Pierre", l: "maison ancienne en pierre", fiche: true },
  { c: "pise", n: "Pisé", l: "maison en pisé", fiche: true },
  { c: "pans", n: "Pans de bois", l: "maison à pans de bois" },
  { c: "6070", n: "Années 1960-70", l: "maison des années 1960-70" },
  { c: "8090", n: "Années 1980-90", l: "maison des années 1980-90" },
  { c: "autre", n: "Autre", l: "autre type de maison" }];
// Les 10 points des fiches par type de maison (t : titre, a : ce qu'il faut dire ; d : quand le type n'a pas sa fiche)
const POINTS = [
  { c: "p1", t: { d: "Murs" },
    a: { pierre: "matériau visible, épaisseur à une baie, enduit extérieur (chaux ou ciment), doublages et sondages",
         pise: "pisé visible ou caché, épaisseur à une baie, enduit extérieur (chaux ou ciment), fissures, soubassement",
         d: "matériau, épaisseur à une baie, enduit extérieur, doublages et sondages, fissures" } },
  { c: "p2", t: { d: "Humidité des murs", pise: "Eau et humidité" },
    a: { pierre: "remontées en pied de mur, salpêtre, enduit cloqué, végétation",
         pise: "ce que tu constates sur les murs (humidité, salpêtre, remontées capillaires), rejaillissement en pied de mur, sol étanche contre le mur (béton, enrobé)",
         d: "ce que tu constates : humidité, salpêtre, remontées en pied de mur, enduit cloqué, végétation" } },
  { c: "p3", t: { d: "Voisinage" },
    a: { pierre: "murs mitoyens, murs sur local chauffé ou sur terrasse du voisin, façade à l'alignement de la rue, pans non accessibles",
         pise: "murs mitoyens, façade à l'alignement de la rue, façade à conserver, pans non accessibles",
         d: "murs mitoyens, façade à l'alignement de la rue, pans non accessibles" } },
  { c: "p4", t: { d: "Plancher bas" },
    a: { pierre: "sur cave, garage ou terre-plein ; bois ou dalle ; accès ; isolant déjà en place ; réseaux et tableaux en sous-face",
         pise: "terre-plein ou cave ; dallage, bois ou terre battue ; accès",
         d: "sur cave, garage, vide sanitaire ou terre-plein ; bois ou dalle ; accès ; isolant déjà en place ; réseaux et tableaux en sous-face" } },
  { c: "p5", t: { d: "Plafonds" },
    a: { pierre: "combles perdus ou aménagés, trappe, état du plancher des combles, couches d'isolant et pare-vapeur",
         pise: "combles perdus ou aménagés, trappe, isolant en place",
         d: "combles perdus ou aménagés, trappe, isolant en place" } },
  { c: "p6", t: { d: "Toiture et couverture", pierre: "Couverture vue des combles", pise: "Toiture" },
    a: { pierre: "jour visible, traces d'eau, bois dégradés",
         pise: "débords de toit, couverture vue des combles, traces d'eau",
         d: "couverture vue des combles, jour visible, traces d'eau, bois dégradés" } },
  { c: "p7", t: { d: "Menuiseries" },
    a: { pierre: "nombre de fenêtres et de portes, vitrage, persiennes ou volets",
         pise: "nombre de fenêtres et de portes, vitrage, volets",
         d: "nombre de fenêtres et de portes, vitrage, volets" } },
  { c: "p8", t: { d: "Ventilation et pièces humides" },
    a: { pierre: "ce qui existe, nombre de pièces humides et de pièces principales, conduits de fumée et poêles",
         pise: "ce qui existe, foyer ouvert, poêle, conduits",
         d: "ce qui existe, nombre de pièces humides et de pièces principales, conduits de fumée et poêles" } },
  { c: "p9", t: { d: "Chauffage et eau chaude" },
    a: { pierre: "appareil, année, radiateurs et robinets, emplacement du ballon, local non chauffé disponible",
         pise: "appareil, année, radiateurs, emplacement du ballon, local non chauffé disponible",
         d: "appareil, année, radiateurs et robinets, emplacement du ballon, local non chauffé disponible" } },
  { c: "p10", t: { d: "Vente" },
    a: { d: "prix annoncé ou avis de valeur, documents remis" } }];
// Ses titres de pathologies, une par zone (n : nom court sur la carte, t : son titre dans le rapport)
const PATHOS = [
  { c: "generale", n: "Pathologies générales", t: "Pathologies générales", general: true, a: "Toutes les pathologies à la suite, sans choisir de zone. Claude les range ensuite par zone." },
  { c: "toiture", n: "Toiture, charpente et zinguerie", t: "Au niveau de la toiture, de la charpente et de la zinguerie", a: "couverture, souche, forget et chevrons, toiture-terrasse, traces de fuite au plafond dessous, gouttières et descentes" },
  { c: "murs", n: "Murs, cloisons et façades", t: "Au niveau des murs, cloisons et façades", a: "fissures, humidité, enduit, pieds de façade, fondations apparentes, végétation" },
  { c: "plafonds", n: "Plafonds", t: "Au niveau des plafonds", a: "" },
  { c: "menuiseries", n: "Menuiseries", t: "Au niveau des menuiseries", a: "extérieures, porte d'entrée, intérieures" },
  { c: "ventilation", n: "Ventilation", t: "Au niveau de la ventilation", a: "" },
  { c: "chauffage", n: "Chauffage, chaufferie et plomberie", t: "Au niveau du chauffage, de la chaufferie et de la plomberie", a: "chaudières, ventilation de la chaufferie, oxydation" },
  { c: "bois", n: "Parties en bois", t: "Au niveau des parties en bois", a: "bois attaqués, insectes" },
  { c: "amiante", n: "Amiante", t: "Au niveau de l'amiante", a: "ce que dit le rapport amiante : rien de repéré, matériaux repérés, ou rapport non communiqué" },
  { c: "inaccessible", n: "Parties non accessibles ou difficilement observables", t: "Au niveau des parties non accessibles ou difficilement observables", a: "une phrase par zone encombrée ou non visible : garage, extérieurs, combles, sous-toiture, murs doublés" }];
// Les questions posées à chaque dossier (g : titre de groupe, ch : choix à toucher, tx : champ à remplir)
const QUESTIONS = [
  { g: "Travaux" },
  { c: "trappe", q: "Trappe d'accès aux combles", ch: ["Il y en a une", "Pas de trappe", "Pas de combles perdus"] },
  { c: "isolant", q: "Ancien isolant des combles", ch: ["À retirer", "Il reste en place", "Pas d'isolant"] },
  { c: "plomberie", q: "Chauffe-eau : modification de la plomberie", ch: ["Oui", "Non"] },
  { c: "luminaires", q: "Luminaires et appareillages électriques à déposer", tx: "Nombre" },
  { c: "coffrage", q: "Coffrage des gaines de VMC", ch: ["Pas de coffrage"], tx: "Surface en m²" },
  { c: "portes", q: "Portes à détalonner", tx: "Nombre" },
  { c: "regulation", q: "Régulation de la pompe à chaleur", tx: "Ce que tu retiens" },
  { c: "robinets", q: "Radiateurs sans robinet thermostatique", tx: "Nombre" },
  { c: "desembouage", q: "Désembouage, si la pompe à chaleur garde les radiateurs", tx: "Prix" },
  { c: "moe", q: "Maîtrise d'œuvre", tx: "Montant TTC" },
  { c: "evacuation", q: "Évacuation", tx: "Montant TTC" },
  { g: "Logement" },
  { c: "logement", q: "Infos du logement", long: true, tx: "Pièces principales, salles de bains, salles d'eau, WC, pièces non chauffées, mitoyenneté, confort d'été, combles, sous-sol, gaz dans la rue, place pour une pompe à chaleur" },
  { c: "occupation", q: "Occupation du bien", tx: "Occupé, vide…" },
  { c: "residence", q: "Résidence", ch: ["Principale", "Secondaire"] },
  { g: "Vente et dossier" },
  { c: "valeur", q: "Valeur vénale ou prix de vente", ch: ["Non communiquée"], tx: "Montant" },
  { c: "commande", q: "Qui a commandé l'audit", tx: "Nom" },
  { c: "accompagnateur", q: "Accompagnateur pendant la visite", tx: "Nom" },
  { c: "typeDossier", q: "Type de dossier", ch: ["Habitation vente"], tx: "Autre" },
  { c: "copro", q: "Copropriété", ch: ["Pas de copropriété", "En copropriété"] },
  { c: "description", q: "Description", ch: ["Selon le croquis"], tx: "Autre" },
  { c: "consentement", q: "Consentement", ch: ["Signé", "Refus", "Dispense"] },
  { c: "vente", q: "Audit réalisé dans le cadre d'une vente", ch: ["Oui", "Non"] },
  { c: "documents", q: "Documents remis", multi: true, ch: ["Plans", "Plan de masse", "Carrez/Boutin", "Taxe d'habitation", "Relevé de propriété", "Contrat d'entretien", "Notices", "Permis de construire", "Étude thermique", "Infiltrométrie", "Factures", "Aucun"] }];
// Cases générales de l'audit : une par sujet, sans choisir de poste, de zone ni de pièce
const GENERAUX = [
  { c: "travaux", n: "Travaux et mesures", a: "Les travaux à recommander, avec tes mesures, sans choisir de poste." },
  { c: "induits", n: "Travaux induits", suite: " (à ranger par poste)", a: "Tous les travaux induits à la suite, sans choisir de poste. Claude les range ensuite." },
  { c: "commentaires", n: "Commentaires et particularités", a: "Particularités du bâtiment, déclarations du propriétaire, choix du scénario." }];

const z2 = n => String(n).padStart(2, "0");
const isoDe = d => `${d.getFullYear()}-${z2(d.getMonth() + 1)}-${z2(d.getDate())}`;
const dateFr = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ""); return m ? `${m[3]}/${m[2]}/${m[1]}` : ""; };
// Un mois après la visite : le même jour du mois suivant, ou le dernier jour de ce mois s'il est plus court
function limiteRapport(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
  if (!m) return "";
  let an = +m[1], mois = +m[2] + 1;
  if (mois > 12) { mois = 1; an++; }
  const dernierJour = new Date(an, mois, 0).getDate();
  return `${an}-${z2(mois)}-${z2(Math.min(+m[3], dernierJour))}`;
}
const dateVisiteDe = v => v.dateVisite || isoDe(new Date(v.cree));
const estAudit = v => !!v && v.mission === "audit";
const rempli = p => !!((p.texte || "").trim() || (p.photos || []).length);
const repondu = r => !!(r && ((r.ch && r.ch.length) || (r.tx || "").trim()));
const titrePoint = (pt, type) => (POINTS.indexOf(pt) + 1) + ". " + (pt.t[type] || pt.t.d);
const aidePoint = (pt, type) => pt.a[type] || pt.a.d;
// Nom affiché d'une rubrique : les points et les pathologies gardent toujours leur titre
function nomDe(p, v) {
  if (p.genre === "dictee") return "Dictée de la visite";
  if (p.genre === "point") { const pt = POINTS.find(x => x.c === p.cle); if (pt) return titrePoint(pt, v.typeMaison); }
  if (p.genre === "patho") { const z = PATHOS.find(x => x.c === p.cle); if (z) return z.t; }
  if (p.genre === "general") { const g = GENERAUX.find(x => x.c === p.cle); if (g) return g.n; }
  return p.nom;
}
function aideDe(p, v) {
  if (p.genre === "dictee") return "Dicte tout à la suite, en disant le nom de la pièce : « Dans le séjour, il y a… ». Claude range ensuite par pièce. Dis à quoi correspond chaque photo.";
  if (p.genre === "point") { const pt = POINTS.find(x => x.c === p.cle); return pt ? "À dire : " + aidePoint(pt, v.typeMaison) + "." : ""; }
  if (p.genre === "patho") {
    const z = PATHOS.find(x => x.c === p.cle);
    if (z && z.general) return "Dicte toutes les pathologies à la suite, sans choisir de zone : Claude les range ensuite par zone. Dis à quoi correspond chaque photo.";
    return (z && z.a ? "À dire : " + z.a + ". " : "") + "2 à 4 photos, les plus parlantes.";
  }
  if (p.genre === "vrac") return "Dicte tout à la suite, sans ordre. Dis à quoi correspond chaque photo.";
  if (p.genre === "general") { const g = GENERAUX.find(x => x.c === p.cle); return g ? g.a + " Dis à quoi correspond chaque photo." : ""; }
  return "";
}

const vue = document.getElementById("vue");
const titre = document.getElementById("titre");
const retour = document.getElementById("retour");
const barre = document.getElementById("barre");
const visionneuse = document.getElementById("visionneuse");
const zonePlan = document.getElementById("zonePlan");
let visite = null, piece = null;
let sauverEnCours = null; // sauvegarde de la dictée de l'écran ouvert
// Photos en cours d'enregistrement : on attend qu'elles soient rangées avant de changer d'écran, sinon elles se perdraient
let travail = Promise.resolve();
function aLaFile(fn) { travail = travail.then(fn, fn).catch(() => {}); return travail; }
const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const echapRegex = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
// Libère la mémoire des images affichées avant de les remplacer
function liberer(zone) {
  if (!zone) return;
  zone.querySelectorAll("img").forEach(i => { if (i.src.startsWith("blob:")) URL.revokeObjectURL(i.src); });
}

/* ---------- Navigation : le bouton retour du téléphone revient à l'écran précédent ---------- */
let historiqueOk = true, etatMemoire = { e: "visites", n: 0 };
try { history.scrollRestoration = "manual"; } catch (e) {}
const defilement = {}; // où on en était dans les listes, pour y revenir
const replis = {};     // aides de l'audit ouvertes ou repliées
const cleDefilement = s => s.e === "visite" ? "v:" + s.v : s.e;
function etatActuel() {
  return (historiqueOk && history.state && history.state.e) ? history.state : etatMemoire;
}
function poser(etat, remplacer) {
  etatMemoire = etat;
  if (!historiqueOk) return;
  try { remplacer ? history.replaceState(etat, "") : history.pushState(etat, ""); }
  catch (e) { historiqueOk = false; }
}
function aller(etat) {
  const ici = etatActuel();
  if (ici.e === "visite" || ici.e === "visites") defilement[cleDefilement(ici)] = window.scrollY;
  poser(Object.assign({}, etat, { n: (ici.n || 0) + 1 }), false);
  afficher(etatActuel());
}
function fermerVisionneuse() {
  visionneuse.classList.add("cache"); liberer(zonePlan); zonePlan.innerHTML = "";
}
async function afficher(etat) {
  await travail;
  fermerVisionneuse();
  if (etat.e === "plan") return afficher(etat.parent || { e: "visites" });
  if (etat.e === "visite") return ecranVisite(etat.v);
  if (etat.e === "piece") return ecranPiece(etat.v, etat.p);
  if (etat.e === "questions") return ecranQuestions(etat.v);
  return ecranVisites();
}
async function retourParent() {
  if (sauverEnCours) { try { await sauverEnCours(); } catch (e) {} }
  const s = etatActuel();
  if (historiqueOk && (s.n || 0) > 0) { history.back(); return; }
  const parent = (s.e === "piece" || s.e === "questions") ? { e: "visite", v: s.v, n: 0 } : { e: "visites", n: 0 };
  poser(parent, true); afficher(parent);
}
window.addEventListener("popstate", async () => {
  if (!visionneuse.classList.contains("cache")) { fermerVisionneuse(); return; }
  if (sauverEnCours) { try { await sauverEnCours(); } catch (e) {} }
  afficher(etatActuel());
});
// Si le téléphone met l'appli en arrière-plan (appel, appareil photo…), la dictée est enregistrée
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && sauverEnCours) sauverEnCours();
});
window.addEventListener("pagehide", () => { if (sauverEnCours) sauverEnCours(); });

/* ---------- Appli installée : icône sur l'écran d'accueil, mise à jour ---------- */
let inviteInstall = null, majPrete = false;

function majBandeau() {
  const z = document.getElementById("maj");
  if (!z) return;
  z.innerHTML = majPrete ? `<div class="alerte">Une nouvelle version de l'appli est arrivée.<button class="btn" id="mettreAJour">Mettre à jour maintenant</button></div>` : "";
  if (majPrete) document.getElementById("mettreAJour").onclick = () => location.reload();
}
async function verifierMaj() {
  if (!EN_LIGNE || majPrete || !("caches" in window)) return;
  try {
    const gardee = await caches.match("index.html");
    if (!gardee) return;
    const m = /const VERSION = "([^"]+)"/.exec(await gardee.text());
    if (m && m[1] !== VERSION) { majPrete = true; majBandeau(); }
  } catch (e) {}
}
function majHorsReseau() {
  if (!EN_LIGNE || !("serviceWorker" in navigator)) return;
  navigator.serviceWorker.ready.then(() => {
    const z = document.getElementById("horsReseau");
    if (z) z.textContent = " L'appli est gardée dans le téléphone : elle s'ouvre aussi sans réseau.";
  }).catch(() => {});
}
if (EN_LIGNE && "serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("message", e => {
    if (e.data && e.data.type === "maj") { majPrete = true; majBandeau(); }
  });
  setTimeout(verifierMaj, 5000);
}

/* ---------- Écran : liste des visites ---------- */
async function ecranVisites() {

  majBandeau(); majInstall(); majHorsReseau(); verifierMaj();
  const caseCopie = document.getElementById("copie");
  if (caseCopie) {
    caseCopie.checked = copieActive();

  const liste = document.getElementById("liste");

    const detail = audit
      ? `${v.pieces.filter(rempli).length} rubrique(s), ${nbPhotos} photo(s)`

      <div class="s">${detail} - ${new Date(v.cree).toLocaleDateString("fr-FR")}${v.envoye ? " - envoyée" : ""}</div>`;

  const creer = async (mission) => {

/* ---------- Écran : une visite ---------- */
async function ecranVisite(id) {
  piece = null; sauverEnCours = null;
  visite = await lire("visites", id);
  if (!visite) { poser({ e: "visites", n: 0 }, true); return ecranVisites(); }
  visite.plans = visite.plans || [];
  titre.textContent = visite.dossier + (estAudit(visite) ? " - Audit" : " - Amiante / plomb");
  retour.classList.remove("cache"); retour.onclick = retourParent;
  liberer(vue);
  if (estAudit(visite)) rendreAudit(); else rendreAmiante();
  document.getElementById("camPlan").onclick = () => document.getElementById("cameraPlan").click();
  document.getElementById("ajPlan").onclick = () => document.getElementById("fichierPlan").click();
  document.getElementById("suppVisite").onclick = async () => {
    if (!confirm("Supprimer la visite " + visite.dossier + " avec son plan et toutes ses photos ?")) return;
    for (const pl of visite.plans) await effacer("photos", pl.id);
    for (const p of visite.pieces) for (const ph of p.photos) await effacer("photos", ph);
    await effacer("visites", visite.id);
    retourParent();
  };
  barre.classList.remove("cache");
  barre.innerHTML = `<button class="btn" id="envoyer">Envoyer à Claude</button><div class="ok" id="etatEnvoi"></div><div id="suiteEnvoi"></div>`;
  document.getElementById("envoyer").onclick = envoyer;
  await afficherPlans();
  const ici = etatActuel();
  if (ici.e === "visite" && ici.v === id) window.scrollTo(0, defilement["v:" + id] || 0);
}

/* Visite amiante / plomb : une seule dictée pour toute la visite, le plan lettré, et les pièces pour qui préfère */
function rendreAmiante() {
  const v = visite;
  const pieces = v.pieces.filter(p => !p.genre);
  const dictee = v.pieces.find(p => p.genre === "dictee");
  const fait = !!dictee && rempli(dictee);
  let etat = "pas encore de dictée";
  if (fait) {
    const debut = (dictee.texte || "").trim();
    etat = (dictee.photos.length ? dictee.photos.length + " photo(s)" : "") + (dictee.photos.length && debut ? " - " : "") + esc(debut.slice(0, 60)) + (debut.length > 60 ? "…" : "");
  }
  vue.innerHTML = `
    <label class="l">Dictée de la visite</label>
    <div class="note">Une seule dictée pour tout le logement, sans rien choisir : « Dans le séjour, il y a… ». Claude range ensuite par pièce.</div>

    <button class="btn sec" id="camPlan">Prendre le plan en photo</button>
    <button class="btn sec" id="ajPlan">Plan depuis la galerie</button>
    <details class="repli" id="secPieces">
      <summary>Pièce par pièce, si tu préfères<span class="compte" id="nbPieces"></span></summary>
      <div class="dedans">
        <div class="note">Seulement si tu veux une dictée et des photos séparées pour chaque pièce.</div>
        <label class="l">Ajouter une pièce</label>
        <div class="grille" id="choix"></div>
        <input type="text" id="autreNom" placeholder="Autre nom de pièce">
        <button class="btn sec" id="ajAutre">Ajouter ce nom</button>
        <label class="l">Pièces de la visite</label>
        <div id="pieces"></div>
      </div>
    </details>
    <button class="btn danger" id="suppVisite">Supprimer cette visite</button>`;
  document.getElementById("dicter").onclick = () => ouvrirFixe("dictee", "dictee");
  const choix = document.getElementById("choix");
  PIECES.forEach(n => {
    const b = document.createElement("button");
    b.textContent = n; b.onclick = () => ajouterPiece(n);
    choix.appendChild(b);
  });
  document.getElementById("ajAutre").onclick = () => {
    const n = document.getElementById("autreNom").value.trim();
    if (n) ajouterPiece(n);
  };
  const lp = document.getElementById("pieces");
  if (!pieces.length) lp.innerHTML = `<div class="s">Aucune pièce pour l'instant.</div>`;
  pieces.forEach(p => lp.appendChild(cartePiece(p)));
  document.getElementById("nbPieces").textContent = pieces.length ? pieces.length + " pièce(s)" : "";
  // Replié au départ ; ouvert tout seul quand la visite a déjà des pièces, et il reste comme on l'a laissé
  const sec = document.getElementById("secPieces"), cle = v.id + ":secPieces";
  sec.open = cle in replis ? replis[cle] : pieces.length > 0;
  sec.ontoggle = () => { replis[cle] = sec.open; };
}
function cartePiece(p) {
  const c = document.createElement("div");
  c.className = "carte";
  const debut = (p.texte || "").slice(0, 80);
  c.innerHTML = `<div class="t">${esc(p.nom)}</div><div class="s">${p.photos.length} photo(s)${debut ? " - " + esc(debut) + (p.texte.length > 80 ? "…" : "") : " - pas encore de dictée"}</div>`;
  c.onclick = () => aller({ e: "piece", v: visite.id, p: p.id });
  return c;
}

/* Visite audit énergétique : type de maison, dictée libre, 10 points, pathologies, questions */
function rendreAudit() {
  const v = visite;
  v.questions = v.questions || {};
  // Une rubrique libre de la version 6 qui porte le nom d'une case générale devient cette case
  let reprise = false;
  v.pieces.forEach(p => {
    if (p.genre && p.genre !== "libre") return;
    const g = GENERAUX.find(x => x.n === p.nom);
    if (g && !v.pieces.some(q => q.genre === "general" && q.cle === g.c)) { p.genre = "general"; p.cle = g.c; reprise = true; }

  if (reprise) ecrire("visites", v);
  vue.innerHTML = `

      <summary>Pathologies rangées par zone<span class="compte" id="nbPathos"></span></summary>
      <div class="note">Seulement si tu préfères les ranger toi-même.</div>
      <div id="pathos"></div>
    </details>
    <label class="l">Questions du dossier</label>
    <div id="cQuestions"></div>
    <label class="l">Tes rubriques</label>
    <div class="note">Tu peux en créer autant que tu veux, avec le nom que tu veux.</div>
    <div id="pieces"></div>
    <input type="text" id="autreNom" placeholder="Nom de ta rubrique">
    <button class="btn sec" id="ajAutre">Ajouter cette rubrique</button>
    <label class="l">Plan ou croquis (facultatif)</label>
    <div id="infoPlan"></div>
    <div class="plans" id="plans"></div>
    <button class="btn sec" id="camPlan">Prendre le plan en photo</button>
    <button class="btn sec" id="ajPlan">Plan depuis la galerie</button>
    <button class="btn danger" id="suppVisite">Supprimer cette visite</button>`;
  const zt = document.getElementById("types");
  TYPES.forEach(t => {
    const b = document.createElement("button");
    b.textContent = t.n;
    if (v.typeMaison === t.c) b.className = "sel";
    b.onclick = async () => {
      if (v.typeMaison === t.c) delete v.typeMaison; else v.typeMaison = t.c;

  const typeChoisi = TYPES.find(t => t.c === v.typeMaison);
  if (typeChoisi && !typeChoisi.fiche) document.getElementById("noteType").textContent = "Pas encore de fiche pour ce type de maison : les 10 points restent généraux.";
  const champDate = document.getElementById("dateVisite");

    majLimite();
  };
  const carteFixe = (zone, genre, cle, nom, aide) => {
    const p = v.pieces.find(x => x.genre === genre && x.cle === cle);
    const fait = !!p && rempli(p);
    const c = document.createElement("div");

  general("travaux"); general("induits");
  carteFixe(zg, "patho", pathoGenerale.c, pathoGenerale.n, pathoGenerale.a);
  general("commentaires");
  const zp = document.getElementById("points");
  POINTS.forEach(pt => carteFixe(zp, "point", pt.c, titrePoint(pt, v.typeMaison), aidePoint(pt, v.typeMaison)));

  const zz = document.getElementById("pathos");

  zones.forEach(z => carteFixe(zz, "patho", z.c, z.n, z.a || "Ce que tu constates"));
  const nbZones = zones.filter(z => { const p = v.pieces.find(x => x.genre === "patho" && x.cle === z.c); return !!p && rempli(p); }).length;
  document.getElementById("nbPoints").textContent = nbPoints + " sur 10";
  document.getElementById("nbPathos").textContent = nbZones + " sur 9";
  // Repliées au départ ; elles restent comme il les a laissées, et s'ouvrent seules s'il y a déjà dicté
  [["secPoints", nbPoints], ["secPathos", nbZones]].forEach(([id, nb]) => {
    const d = document.getElementById(id), cle = v.id + ":" + id;
    d.open = cle in replis ? replis[cle] : nb > 0;

  cq.innerHTML = `<div class="t">Répondre aux questions</div><div class="s">${nbR} réponse(s) sur ${nbQ} - trappe, isolant, plomberie, valeur vénale, documents…</div>`;
  cq.onclick = () => aller({ e: "questions", v: v.id });
  document.getElementById("cQuestions").appendChild(cq);
  const lp = document.getElementById("pieces");
  v.pieces.filter(p => !p.genre || p.genre === "libre").forEach(p => lp.appendChild(cartePiece(p)));
  const ouvrirLibre = nom => {
    const deja = v.pieces.find(p => (!p.genre || p.genre === "libre") && p.nom === nom);
    if (deja) aller({ e: "piece", v: v.id, p: deja.id }); else ajouterPiece(nom, "libre");
  };
  document.getElementById("ajAutre").onclick = () => {

}
// Ouvre un point, une pathologie ou la dictée en vrac (créé à la première ouverture)
async function ouvrirFixe(genre, cle, remplacer) {
  const v = visite;
  let p = v.pieces.find(x => x.genre === genre && x.cle === cle);
  if (!p) {
    p = { id: nouvelId(), nom: "", texte: "", photos: [], genre, cle };
    p.nom = genre === "vrac" ? "En vrac" : nomDe(p, v);
    v.pieces.push(p);

  if (!remplacer) return aller({ e: "piece", v: v.id, p: p.id });
  const etat = Object.assign({}, etatActuel(), { e: "piece", v: v.id, p: p.id });
  poser(etat, true); afficher(etat);
}

/* ---------- Copie des photos dans le téléphone (dossier Téléchargements) ---------- */
function copieActive() { if (IOS) return false; try { return localStorage.getItem("copiePhotos") !== "0"; } catch (e) { return true; } }
function heure() { const d = new Date(), z = n => String(n).padStart(2, "0"); return `${z(d.getHours())}h${z(d.getMinutes())}m${z(d.getSeconds())}s`; }
function extension(f) { const t = (f.type || "").split("/")[1] || "jpg"; return t === "jpeg" ? "jpg" : t; }
function copierDansTelephone(fichier, nom) {
  try {
    const url = URL.createObjectURL(fichier);
    const a = document.createElement("a");
    a.href = url; a.download = nom;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) {}
}

async function ajouterPiece(nom, genre) {
  // Numéro automatique quand il y en a plusieurs (Chambre 1, Chambre 2…), jamais deux fois le même nom
  const re = new RegExp("^" + echapRegex(nom) + " (\\d+)$");
  const libres = visite.pieces.filter(p => !p.genre || p.genre === "libre");
  const exacte = libres.find(p => p.nom === nom);
  let max = Math.max(0, ...libres.map(p => { const m = p.nom.match(re); return m ? +m[1] : 0; }));
  let final = nom;
  if (exacte) { max += 1; exacte.nom = nom + " " + max; }
  if (exacte || max > 0) final = nom + " " + (max + 1);
  const p = { id: nouvelId(), nom: final, texte: "", photos: [] };
  if (genre) p.genre = genre;
  visite.pieces.push(p);
  await ecrire("visites", visite);
  aller({ e: "piece", v: visite.id, p: p.id });
}

/* Photos réduites pour garder des fichiers légers, plus une miniature pour l'affichage */
function reduire(file, max = 1600, qualite = 0.85) {
  return new Promise(ok => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => ok(b || file), "image/jpeg", qualite);
    };
    img.onerror = () => { URL.revokeObjectURL(url); ok(file); };
    img.src = url;
  });
}

/* ---------- Envoi à Claude ---------- */
const nomFichier = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "");
function nomsUniques() {
  const pris = new Set();
  return n => { const base = n.replace(/\.jpg$/, ""); let r = n, k = 2; while (pris.has(r)) r = `${base}_${k++}.jpg`; pris.add(r); return r; };
}
// Visite amiante / plomb
async function preparer() {
  let texte = `Visite dossier ${visite.dossier}\n(dictée prise hors réseau)\n`;
  const fichiers = [];
  const unique = nomsUniques();
  const plans = visite.plans || [];
  if (plans.length) {
    const noms = [];
    let i = 1;
    for (const pl of plans) {
      const ph = await lire("photos", pl.id);
      if (!ph) continue;
      const n = unique(`${nomFichier(visite.dossier)}_PLAN_${i++}_${nomFichier(pl.nom)}.jpg`);
      fichiers.push(new File([ph.blob], n, { type: "image/jpeg" }));
      noms.push(`${pl.nom} : ${n}`);
    }
    texte += `\nPlan lettré :\n${noms.join("\n")}\n`;
  } else {
    texte += `\nPas de plan joint.\n`;
  }
  const photosDe = async (p, nom) => {
    const noms = [];
    let i = 1;
    for (const phId of p.photos) {
      const ph = await lire("photos", phId);
      if (!ph) continue;
      const n = unique(`${nomFichier(visite.dossier)}_${nomFichier(nom)}_${i++}.jpg`);
      fichiers.push(new File([ph.blob], n, { type: "image/jpeg" }));
      noms.push(n);
    }
    return noms;
  };
  // La dictée unique : toutes les pièces à la suite, c'est Claude qui les sépare
  const dictee = visite.pieces.find(p => p.genre === "dictee");
  if (dictee && rempli(dictee)) {
    texte += `\n=== Dictée de la visite (toutes les pièces à la suite, à ranger par pièce) ===\n${(dictee.texte || "").trim() || "(pas de dictée, seulement des photos)"}\n`;
    const noms = await photosDe(dictee, "Dictée");
    if (noms.length) texte += `Photos : ${noms.join(", ")}\n`;
  }
  for (const p of visite.pieces) {
    if (p.genre === "dictee") continue;
    texte += `\n=== ${p.nom} ===\n${(p.texte || "").trim() || "(pas de dictée)"}\n`;
    const noms = await photosDe(p, p.nom);
    if (noms.length) texte += `Photos : ${noms.join(", ")}\n`;
  }
  return { texte, fichiers };
}
// Visite audit énergétique
async function preparerAudit() {
  const v = visite;
  const prefixe = nomFichier(v.dossier) + "_AUDIT";
  const type = TYPES.find(t => t.c === v.typeMaison);
  const jour = dateVisiteDe(v);
  let texte = `Visite AUDIT ÉNERGÉTIQUE - dossier ${v.dossier}\n(dictée prise hors réseau)\n`;
  texte += `Date de la visite : ${dateFr(jour)} - rapport à envoyer au client au plus tard le ${dateFr(limiteRapport(jour))}\n`;
  texte += `Type de maison annoncé : ${type ? type.l : "non précisé"}\n`;
  const fichiers = [];
  const unique = nomsUniques();
  const plans = v.plans || [];
  if (plans.length) {
    const noms = [];
    let i = 1;
    for (const pl of plans) {
      const ph = await lire("photos", pl.id);
      if (!ph) continue;
      const n = unique(`${prefixe}_PLAN_${i++}_${nomFichier(pl.nom)}.jpg`);
      fichiers.push(new File([ph.blob], n, { type: "image/jpeg" }));
      noms.push(`${pl.nom} : ${n}`);
    }
    texte += `\nPlan ou croquis :\n${noms.join("\n")}\n`;
  }
  const rubrique = async (p) => {
    const nom = nomDe(p, v);
    let suite = p.genre === "patho" && p.cle === "generale" ? " (à ranger par zone)" : "";
    if (p.genre === "general") { const g = GENERAUX.find(x => x.c === p.cle); if (g && g.suite) suite = g.suite; }
    let bloc = `\n=== ${nom}${suite} ===\n${(p.texte || "").trim() || "(pas de dictée)"}\n`;
    const noms = [];
    let i = 1;
    for (const phId of p.photos) {
      const ph = await lire("photos", phId);
      if (!ph) continue;
      const n = unique(`${prefixe}_${nomFichier(nom)}_${i++}.jpg`);
      fichiers.push(new File([ph.blob], n, { type: "image/jpeg" }));
      noms.push(n);
    }
    if (noms.length) bloc += `Photos : ${noms.join(", ")}\n`;
    return bloc;
  };
  const de = (genre, cle) => v.pieces.find(p => p.genre === genre && p.cle === cle);
  const generales = [de("vrac", "vrac")].concat(GENERAUX.map(g => de("general", g.c))).filter(p => p && rempli(p));
  if (generales.length) {
    texte += `\n--- Dictée générale ---\n`;
    for (const p of generales) texte += await rubrique(p);
  }
  texte += `\n--- Les 10 points à voir sur place ---\n`;
  const sansDictee = [];
  for (const pt of POINTS) {
    const p = de("point", pt.c);
    if (p && rempli(p)) texte += await rubrique(p); else sansDictee.push(titrePoint(pt, v.typeMaison));
  }
  if (sansDictee.length) texte += `\nPoints sans dictée : ${sansDictee.join(" ; ")}\n`;
  const pathos = PATHOS.map(z => de("patho", z.c)).filter(p => p && rempli(p));
  texte += `\n--- Pathologies ---\n`;
  if (pathos.length) for (const p of pathos) texte += await rubrique(p); else texte += `(aucune pathologie dictée dans cette partie)\n`;
  const libres = v.pieces.filter(p => !p.genre || p.genre === "libre");
  if (libres.length) {
    texte += `\n--- Autres rubriques ---\n`;
    for (const p of libres) texte += await rubrique(p);
  }
  texte += `\n--- Questions du dossier ---\n`;
  const sansReponse = [];
  for (const q of QUESTIONS) {
    if (!q.c) continue;
    const r = (v.questions || {})[q.c];
    if (!repondu(r)) { sansReponse.push(q.q); continue; }
    const parts = (r.ch || []).slice();
    if ((r.tx || "").trim()) parts.push(r.tx.trim());
    texte += `${q.q} : ${parts.join(", ")}\n`;
  }
  if (sansReponse.length) texte += `Sans réponse : ${sansReponse.join(" ; ")}\n`;
  return { texte, fichiers };
}
const peutPartager = l => { try { return !!(navigator.canShare && navigator.canShare({ files: l })); } catch (e) { return false; } };
async function envoyer() {
  const etat = document.getElementById("etatEnvoi");
  const suite = document.getElementById("suiteEnvoi");
  const audit = estAudit(visite);
  if (!audit && !(visite.plans || []).length && !confirm("Il n'y a pas de plan dans cette visite. Envoyer quand même ?")) return;
  const v = visite;
  suite.innerHTML = "";
  await travail;
  const { texte, fichiers } = audit ? await preparerAudit() : await preparer();
  const fichierTexte = new File([texte], `${nomFichier(v.dossier)}${audit ? "_AUDIT" : ""}_dictee.txt`, { type: "text/plain" });
  const tous = [fichierTexte, ...fichiers];
  const titreEnvoi = (audit ? "Visite audit " : "Visite ") + v.dossier;
  const partagerTout = async () => {
    await navigator.share({ title: titreEnvoi, text: texte, files: tous });
    v.envoye = true; await ecrire("visites", v);
    suite.innerHTML = "";
    etat.textContent = "Partagé. Dans Claude, appuie sur Envoyer.";
  };
  // Trop de fichiers pour un seul partage : envoi en plusieurs parties
  const TAILLE = 10;
  const enParties = () => {
    const taille = tous.length > TAILLE ? TAILLE : Math.ceil(tous.length / 2);
    if (!(tous.length > 1 && peutPartager(tous.slice(0, taille)))) return false;
    const paquets = [];
    for (let i = 0; i < tous.length; i += taille) paquets.push(tous.slice(i, i + taille));
    etat.textContent = "Trop de fichiers pour un seul envoi : envoie les parties une par une, dans la même conversation Claude.";
    suite.innerHTML = "";
    paquets.forEach((pq, k) => {
      const b = document.createElement("button");
      b.className = "btn sec";
      b.textContent = `Envoyer la partie ${k + 1} sur ${paquets.length}`;
      b.onclick = async () => {
        try {
          await navigator.share({ title: `${titreEnvoi} - partie ${k + 1} sur ${paquets.length}`, files: pq });
          b.textContent = `Partie ${k + 1} sur ${paquets.length} : partagée`;
          if (k === paquets.length - 1) { v.envoye = true; await ecrire("visites", v); }
        } catch (e) {}
      };
      suite.appendChild(b);
    });
    return true;
  };
  // Solution de secours : texte copié et fichiers téléchargés
  const secours = async () => {
    try { await navigator.clipboard.writeText(texte); } catch (e) {}
    for (const f of tous) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(f); a.download = f.name;
      document.body.appendChild(a); a.click(); a.remove();
      await new Promise(r => setTimeout(r, 300));
    }
    etat.textContent = "Partage direct impossible : la dictée est copiée et les fichiers sont dans Téléchargements. Colle-les dans la conversation Claude.";
  };
  if (peutPartager(tous)) {
    try { await partagerTout(); return; }
    catch (err) {
      if (err && err.name === "AbortError") { etat.textContent = "Envoi annulé, rien n'est perdu."; return; }
      if (err && err.name === "NotAllowedError") {
        // Le téléphone veut un appui juste avant le partage : tout est prêt, le deuxième appui envoie tout de suite
        etat.textContent = "La visite est prête.";
        const b = document.createElement("button");
        b.className = "btn"; b.id = "envoyer2"; b.textContent = "Appuie ici pour l'envoyer";
        b.onclick = async () => {
          try { await partagerTout(); }
          catch (e2) {
            if (e2 && e2.name === "AbortError") { etat.textContent = "Envoi annulé, rien n'est perdu."; return; }
            if (!enParties()) secours();
          }
        };
        suite.appendChild(b);
        return;
      }
    }
  }
  if (enParties()) return;
  await secours();
}

/* ---------- Démarrage : on revient là où on en était ---------- */
ouvrirBase().then(async () => {
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  let depart = { e: "visites", n: 0 };
  try { if (history.state && history.state.e) depart = history.state; else history.replaceState(depart, ""); }
  catch (e) { historiqueOk = false; }
  etatMemoire = depart;
  afficher(depart);
}).catch(() => {
  vue.innerHTML = EN_LIGNE
    ? `<div class="alerte">Le téléphone refuse d'enregistrer : rien ne serait gardé.<br><br>
    Ferme l'appli et rouvre-la par son icône, hors navigation privée.<br><br>
    Si ce message revient, dis-le à Claude.</div>`
    : `<div class="alerte">Le téléphone refuse d'enregistrer depuis ce fichier : rien ne serait gardé.<br><br>
    Ouvre le fichier avec Chrome, depuis Mes fichiers puis Téléchargements.<br><br>
    Si ce message revient, dis-le à Claude.</div>`;
});
